<app-setup-banner></app-setup-banner>
<app-header></app-header>

@if (words().length === 0) {
  <app-prompt-form></app-prompt-form>
} @else {
  <app-word-practice></app-word-practice>
  <app-main-section
    [words]="words()"
    [score]="score()"
    [attempts]="attempts()"
    [allAttempted]="allWordsAttempted()"
    (wordChecked)="checkWord($event)"
    (practiceFinalized)="finalizePractice()"
    (practiceCancelled)="cancelPractice()"
  ></app-main-section>
}

@if (showResultsModal()) {
  <app-results-modal
    [score]="lastScore()"
    [totalWords]="lastTotalWords()"
    [finalAccuracy]="lastFinalAccuracy()"
    (restarted)="restartPractice()"
  ></app-results-modal>
}
